# Local development stack. Usage: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone   # local-only credentials
      POSTGRES_DB: keystone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://keystone:keystone@db:5432/keystone
      # Ollama runs on your Mac, outside Docker. host.docker.internal is the Mac as seen
      # from inside a container (Docker Desktop provides it).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Local-only metrics token (Prometheus below uses the same). Override in .env.
      METRICS_TOKEN: ${METRICS_TOKEN:-local-dev-metrics-token}
    # Apply migrations, load the policy documents (skipped if unchanged), start the server.
    # If loading fails (e.g. the embedding model isn't pulled), the server still starts;
    # policy questions then get "couldn't search the policies" until it's fixed.
    # start.sh: migrate → load the knowledge base → serve (same as the cloud deployment)
    # Secrets (e.g. the Firebase service-account key for push) are mounted read-only from
    # backend/secrets/, which git ignores. Point FCM_SERVICE_ACCOUNT_FILE at the file in .env.
    volumes:
      - ./backend/secrets:/run/secrets/keystone:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # --- Monitoring (optional): docker compose --profile observability up -------------
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      # Local only: open without a login, read-only for anonymous viewers.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/keystone.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
