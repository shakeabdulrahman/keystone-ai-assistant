# Render Blueprint: one free Docker web service. Database: Neon free Postgres (pgvector).
# Deploy: Render dashboard → New → Blueprint → this repository. Values marked
# `sync: false` are asked for once and stored by Render as secrets (never in git).
# Full guide: docs/deployment.md
services:
  - type: web
    name: keystone-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths: ["backend/**"]
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL            # Neon → Connection string (direct, not "pooled")
        sync: false
      - key: DATABASE_POOL_SIZE      # Neon free has a small connection limit
        value: "3"
      - key: AUTH_MODE
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Chat: Groq first (fast); if it can't answer, Gemini. Embeddings: Gemini.
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY            # console.groq.com → API Keys
        sync: false
      - key: GROQ_MODEL              # list current models: GET api.groq.com/openai/v1/models
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_PROVIDERS
        value: gemini
      - key: EMBEDDING_PROVIDER      # keep: the stored vectors were made with Gemini
        value: gemini
      - key: GEMINI_API_KEY          # Google AI Studio → Get API key
        sync: false
      - key: GEMINI_MODEL            # check current free models; change without a rebuild
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS  # tried in order if the main model is busy or unavailable
        value: gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.1-flash-lite
      - key: TRUSTED_PROXY_HOPS      # Render's proxy appends the caller's IP
        value: "1"
      - key: METRICS_TOKEN
        generateValue: true
      - key: APP_CHECK_MODE          # monitor first; enforce once the app sends tokens
        value: monitor
      - key: FIREBASE_PROJECT_NUMBER
        sync: false
      # Push: add the service-account key as a Secret File named
      # firebase-service-account.json (Environment → Secret Files). Render mounts it here.
      - key: FCM_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/firebase-service-account.json
