# Weekly dependency update PRs; CI (tests + security audit) runs on each.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /mobile
    schedule: { interval: weekly }
    groups:
      android-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
