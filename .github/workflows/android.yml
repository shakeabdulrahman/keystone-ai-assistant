name: Android

on:
  push:
    branches: [main]
    paths: ["mobile/**", "contracts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", "contracts/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json is kept out of git. CI only builds and runs unit tests (no real
      # sign-in), so a placeholder with the right shape is enough. For signed release builds,
      # store the real file as a repository secret and write it here instead.
      - name: Provide Firebase config
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" > androidApp/google-services.json
          else
            cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "keystone-ci", "storage_bucket": "keystone-ci.appspot.com"},
            "client": [
              {"client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.keystone.assistant"}},
               "oauth_client": [], "api_key": [{"current_key": "ci-placeholder"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}},
              {"client_info": {"mobilesdk_app_id": "1:000000000000:android:1111111111111111", "android_client_info": {"package_name": "com.keystone.assistant.debug"}},
               "oauth_client": [], "api_key": [{"current_key": "ci-placeholder"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}
            ],
            "configuration_version": "1"
          }
          JSON
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Unit tests (shared KMP + app)
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      # Unsigned, minified release build: catches R8/shrinking problems before a real release.
      - name: Build release APK (unsigned)
        run: ./gradlew :androidApp:assembleRelease
        env:
          KEYSTONE_RELEASE_API_BASE_URL: https://keystone-api.example.invalid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keystone-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            mobile/**/build/reports/
          retention-days: 7
