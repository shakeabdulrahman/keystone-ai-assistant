name: SDK

on:
  push:
    branches: [main]
    paths: ["sdk/**", "mobile/gradle/libs.versions.toml", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["sdk/**", "mobile/gradle/libs.versions.toml", ".github/workflows/sdk.yml"]

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk

jobs:
  jvm-android:
    name: JVM + Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Common tests on the JVM, Android unit tests, the sample, and a local publish dry run.
      - name: Test
        run: ./gradlew jvmTest testDebugUnitTest :samples:jvm-cli:compileKotlinJvm --stacktrace
      - name: Publish to Maven Local (no upload)
        run: ./gradlew publishToMavenLocal

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-test-reports
          path: sdk/**/build/reports/
          retention-days: 7

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test iOS targets
        run: ./gradlew compileKotlinIosArm64 iosSimulatorArm64Test --stacktrace
